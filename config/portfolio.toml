# Portfolio health dashboard config.
[scan]
root = "~/Documents/code/projects/AIStuff/STEM_studybuddy"
exclude = ["project-critique", "_claude-memory-*", "studybuddy_free", "*-wt"]   # own repo, memory symlink dirs (glob), archived products, git worktrees (a worktree has a .git *file*, so it scans as a duplicate of its parent repo — e.g. thittam-demo-wt double-counting Thittam)

# Stages that are exploratory — NOT expected to be feature-complete or rigor-heavy,
# so health rules don't mark them red for being early. Everything else "expects" rigor.
exploratory_stages = ["passion", "prototype", "pre-mvp", "spec", "early-build", "unknown"]

# Stable-by-design repos (glob, fnmatch on dir name) — released libraries whose
# dormancy is the intended state. Exempt from the dormant→red rule so a quiet,
# finished shared library doesn't nag as "red". wegofwd-secure: BYOK security
# primitives, one canonical copy, stable at v0.1.0.
stable = ["wegofwd-secure"]

# Deferred repos (glob, fnmatch on dir name) — intentionally parked for now but
# expected to resume, so exempt from the dormant→red rule (reported "deferred",
# not "stable"). thittam_docs: docs deliberately trail the active thittam code
# and will be updated once it matures.
deferred = ["thittam_docs"]
