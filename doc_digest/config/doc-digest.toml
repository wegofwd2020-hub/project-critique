# doc_digest/config/doc-digest.toml — per-project doc-path map for the weekly digest.
# Hub holding the 10 watched repos. Default matches portfolio_health (the
# STEM_studybuddy machine where the daily cron runs). On another machine,
# override with the CLI's --base (the digest.sh wrapper passes --base "$PORTFOLIO_ROOT").
base      = "~/Documents/code/projects/AIStuff/STEM_studybuddy"
exclude   = ["**/node_modules/**", "**/.venv/**", "**/dist/**", "*-wt/**"]
sdd_globs = ["docs/superpowers/**"]
doc_exts  = [".md", ".txt", ".rst"]

[[project]]
name = "Mentible"
include = ["docs", "Plans"]
[[project]]
name = "thittam"
include = ["docs"]
[[project]]
name = "StudyBuddy_OnDemand"
include = ["docs"]
[[project]]
name = "pramana"
include = ["docs"]
[[project]]
name = "kathai-chithiram"
include = ["docs"]
[[project]]
name = "atri-sangam"
include = ["docs"]
[[project]]
name = "mambakkam-net"
include = ["docs"]
[[project]]
name = "wegofwd-llm"
include = ["README.md", "docs"]
[[project]]
name = "wegofwd-video"
include = ["README.md"]
[[project]]
name = "dronePrjs"
include = ["CLAUDE.md", "closedSpace/docs"]
